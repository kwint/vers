# Builds the `vers-changelog` wheels for PyPI: each wheel contains only the
# native `vers` binary (as ruff and uv do). The version comes from Cargo.toml.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "vers-changelog"
dynamic = ["version"]
description = "Fresh changelogs for every release: Keep a Changelog sections and SemVer versions from news fragments, for any language and monorepos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
keywords = ["changelog", "semver", "release", "monorepo", "towncrier"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control",
]

[project.urls]
Homepage = "https://kwint.github.io/vers/"
Documentation = "https://kwint.github.io/vers/"
Repository = "https://github.com/kwint/vers"
Changelog = "https://github.com/kwint/vers/blob/main/CHANGELOG.md"
Issues = "https://github.com/kwint/vers/issues"

[tool.maturin]
bindings = "bin"
