# Builds the `vers-changelog` wheels (binary only, `bindings = "bin"`) and the
# sdist with maturin, and publishes them to PyPI with trusted publishing.
#
# Called by release.yml (generated by dist, see `publish-jobs` in
# dist-workspace.toml) after the GitHub Release is created. PyPI's trusted
# publisher is registered for the *calling* workflow: release.yml.
#
# Run it manually (Actions -> Publish to PyPI -> Run workflow) to build the
# wheels without publishing.
name: Publish to PyPI

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.target }}${{ matrix.manylinux && format(', {0}', matrix.manylinux) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: "2_17" }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_17" }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        if: ${{ !matrix.manylinux }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --locked --out dist
      - uses: actions/setup-python@v7
        if: ${{ !contains(matrix.target, 'musl') }}
        with:
          python-version: "3.x"
      - name: Check the wheel installs and runs
        # musllinux wheels don't install on the glibc runners.
        if: ${{ !contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          python -m venv .venv-check
          if [ -d .venv-check/Scripts ]; then bin=.venv-check/Scripts; else bin=.venv-check/bin; fi
          py="$bin/python"; vers="$bin/vers"
          "$py" -m pip install --no-index --find-links dist vers-changelog
          "$vers" --version
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    # Only when called by release.yml for a release, not on a manual run.
    if: ${{ inputs.plan != '' }}
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/project/vers-changelog/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
