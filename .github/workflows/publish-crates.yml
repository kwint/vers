# Publishes `vers-changelog` to crates.io with trusted publishing (OIDC): no
# long-lived token, rust-lang/crates-io-auth-action exchanges the GitHub OIDC
# token for a short-lived crates.io token.
#
# Called by release.yml (generated by dist, see `publish-jobs` in
# dist-workspace.toml) after the GitHub Release is created. crates.io's
# trusted publisher is registered for the *calling* workflow: release.yml.
#
# Run it manually (Actions -> Publish to crates.io -> Run workflow) for a
# `cargo publish --dry-run`.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    if: ${{ inputs.plan == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    if: ${{ inputs.plan != '' }}
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://crates.io/crates/vers-changelog
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
