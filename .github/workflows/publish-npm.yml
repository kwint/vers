# Publishes the `vers-changelog` npm package built by dist (the npm installer
# in dist-workspace.toml) with npm trusted publishing (OIDC) and provenance.
# No NPM_TOKEN: npm >= 11.5.1 exchanges the GitHub OIDC token itself.
#
# Called by release.yml (generated by dist, see `publish-jobs` in
# dist-workspace.toml) after the GitHub Release is created. npm checks the
# *calling* workflow, so the trusted publisher is registered for release.yml.
name: Publish to npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://www.npmjs.com/package/vers-changelog
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch npm packages
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install --global npm@11.21.0 && npm --version
      - name: Publish
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npm publish --provenance --access public "./npm/${pkg}"
          done
