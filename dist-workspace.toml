[workspace]
members = ["cargo:."]

# Config for 'dist' (https://axodotdev.github.io/cargo-dist/).
# Regenerate .github/workflows/release.yml after editing: `dist generate`.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# Where to host releases
hosting = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# The shell/PowerShell installers put `vers` in ~/.local/bin (docs/how-to/install.md)
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# `vers self update` is built in (axoupdater); don't install a separate updater
# binary. The installers still write an install receipt, which is what
# `vers self update` uses to find and replace the installed binary.
install-updater = false
# The npm package (the command it installs is still `vers`)
npm-package = "vers-changelog"
# Publish with trusted publishing (OIDC) from our own reusable workflows instead
# of dist's token-based jobs. Each workflow is .github/workflows/<name>.yml.
publish-jobs = ["./publish-crates", "./publish-pypi", "./publish-npm"]
# Run `dist plan` on pull requests so the release config is checked without releasing
pr-run-mode = "upload"

# Permissions for the publish jobs above: read the repository, and get an OIDC
# token for trusted publishing.
[dist.github-custom-job-permissions]
"publish-crates" = { contents = "read", id-token = "write" }
"publish-pypi" = { contents = "read", id-token = "write" }
"publish-npm" = { contents = "read", id-token = "write" }
