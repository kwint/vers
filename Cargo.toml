[package]
name = "vers-changelog"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fresh changelogs for every release: Keep a Changelog sections and SemVer versions from news fragments, for any language and monorepos."
license = "MIT"
repository = "https://github.com/kwint/vers"
readme = "README.md"
keywords = ["changelog", "semver", "release", "monorepo", "towncrier"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://kwint.github.io/vers/"
documentation = "https://kwint.github.io/vers/"
# The tests run the tutorials in docs/tutorials, so ship those with the tests
# and `cargo test` works from the published crate.
include = [
    "/src/**",
    "/tests/**",
    "/docs/tutorials/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]

[lib]
name = "vers"
path = "src/lib.rs"

[[bin]]
name = "vers"
path = "src/main.rs"

[features]
default = ["self-update"]
# `vers self update` for installs made by the standalone installers. Distro and
# package-manager builds can turn it off with `--no-default-features`.
self-update = ["dep:axoupdater"]

[dependencies]
axoupdater = { version = "0.10.2", features = ["blocking"], optional = true }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
globset = "0.4.20"
ignore = "0.4.33"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = "0.2.38"
regex = "1.13.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
similar = "3.2.0"
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["preserve_order"] }
toml_edit = "0.25.17"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
